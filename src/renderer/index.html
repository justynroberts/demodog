<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemoDog</title>
    <!-- Typefaces are bundled, not linked. A recorder is used on aeroplanes and
         in conference rooms with captive wifi, and a linked stylesheet means the
         whole interface silently falls back to the system font there. It also
         removes the only third-party request the app was making. -->
    <script>
      // Applied before first paint so the window never flashes the wrong theme.
      // Light unless asked otherwise: the editor is judged against the picture
      // it is showing, and a dark shell makes every recording look brighter and
      // more contrasty than it really is.
      try {
        const stored = localStorage.getItem('demodog-theme')
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'dark' || stored === 'light' ? stored : 'light'
        )
      } catch {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
