<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DemoDog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Spline+Sans+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the window never flashes the wrong theme.
      // Light unless asked otherwise: the editor is judged against the picture
      // it is showing, and a dark shell makes every recording look brighter and
      // more contrasty than it really is.
      try {
        const stored = localStorage.getItem('demodog-theme')
        document.documentElement.setAttribute(
          'data-theme',
          stored === 'dark' || stored === 'light' ? stored : 'light'
        )
      } catch {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
